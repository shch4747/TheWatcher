[project]
name = "watcher"
version = "0.1.0"
description = "Watcher: WhatsApp -> correct, current wiki (v1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
    "pydantic-ai-slim[openai]>=0.0.14",
    "mcp>=1.0",
    "typesafe-sdk>=0.7.0",
    # Observability (ADR-0013). genai-prices is already a pydantic-ai
    # transitive dep; pinned explicitly because shared/observability/cost.py
    # imports it directly and must not break on a pydantic-ai bump.
    "genai-prices>=0.0.28",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 110
src = ["shared", "agents", "tests"]
# Frozen per ADR-0010 — not ours to fix up as a side effect of v1 work.
extend-exclude = ["agents/innovation_agent", "agents/research_agent"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["shared"]
explicit_package_bases = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]
