name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy shared
      - run: uv run mypy agents/wa_agent
      - run: uv run mypy agents/project_agent
      - run: uv run mypy main.py
      - run: uv run pytest -q
